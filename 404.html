<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Page Not Found — Rallys Equities</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#0A6B4B;--g2:#0D8F63;--au:#C8A84B;--au2:#E2C070;--nv:#05101E;--nv2:#081828;--tx:#F6F2EA;--mt:color-mix(in srgb, var(--tx) 56%, transparent);--gb:color-mix(in srgb, var(--au) 20%, transparent)}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--nv);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.65}
.wrap{max-width:520px;text-align:center}
.lm{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));border:1px solid color-mix(in srgb, var(--au) 40%, transparent);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--au);margin:0 auto 28px}
.code{font-family:'Cormorant Garamond',serif;font-size:clamp(56px,12vw,88px);font-weight:700;color:var(--au);line-height:1;letter-spacing:.02em}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,4vw,28px);font-weight:600;margin:14px 0 10px}
p{color:var(--mt);font-size:14.5px;margin:0 auto 30px;max-width:40ch}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.b{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:9px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;transition:transform .15s,opacity .15s}
a.b:hover{transform:translateY(-2px)}
.b-g{background:var(--g);color:#fff}
.b-o{border:1px solid var(--gb);color:var(--tx)}
</style>
</head>
<body>
<div class="wrap">
  <div class="lm">RE</div>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for may have moved or the link may be out of date. Here are a few places to go instead.</p>
  <div class="btns">
    <a class="b b-g" href="/">Back to Home</a>
    <a class="b b-o" href="/contact">Contact Us</a>
  </div>
</div>
</body>
</html>
