<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Set your password — Rallys Equities</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --nv:#F4F1E8; --nv2:#FBF9F2; --card:#FFFFFF; --g:#0A6B4B; --g2:#0D8F63;
         --au:#9A7B1F; --tx:#12243A; --mt:#4C6076; --dim:#7D8B9B; --dn:#C0392B;
         --line:rgba(154,123,31,.24); --line2:rgba(18,36,58,.14); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--tx);
    background:radial-gradient(1000px 540px at 50% -12%, rgba(154,123,31,.10), transparent 60%),
               linear-gradient(180deg,#FBF9F2,#EFEADB);
    display:flex; align-items:center; justify-content:center; padding:22px; min-height:100vh; }
  .shell{ width:100%; max-width:412px; }
  .card{ background:var(--card);
    border:1px solid var(--line); border-radius:20px; box-shadow:0 26px 70px -30px rgba(40,50,70,.35);
    padding:0; overflow:hidden; text-align:left; }
  /* emerald edge + gold hairline — the same signature as the invite email */
  .rule{ height:4px; background:var(--g); } .rule.thin{ height:2px; background:var(--au); }
  .cbody{ padding:30px 30px 28px; }
  .brand{ text-align:center; margin-bottom:24px; }
  /* the logo is 140×99 — height drives the size and aspect-ratio keeps it honest.
     A white plate keeps the dark ink legible on any background. */
  .plate{ display:inline-flex; align-items:center; justify-content:center; background:#fff;
    border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:14px; }
  .plate img{ display:block; height:40px; width:auto; aspect-ratio:140/99; }
  .brand h1{ font-family:'Cormorant Garamond',Georgia,serif; font-size:26px; font-weight:700; color:var(--tx); margin:0; line-height:1.1; }
  .brand .sub{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--au); font-weight:600; margin-top:9px; }
  h2{ font-family:'Cormorant Garamond',Georgia,serif; font-size:23px; font-weight:700; color:var(--tx); margin:0 0 4px; }
  p.lead{ font-size:13px; color:var(--mt); line-height:1.6; margin:0 0 20px; }
  label{ display:block; font-size:11px; font-weight:600; color:var(--mt); margin-bottom:7px; letter-spacing:.03em; }
  .pwrow{ display:flex; gap:8px; }
  input[type=password],input[type=text]{ flex:1; width:100%; background:#FCFBF7; border:1px solid var(--line2);
    border-radius:10px; padding:12px 14px; color:var(--tx); font-size:14px; outline:none; font-family:inherit; transition:border-color .2s; }
  input:focus{ border-color:var(--g); }
  input::placeholder{ color:var(--dim); }
  .eye{ background:transparent; border:1px solid var(--line2); color:var(--mt); border-radius:10px; padding:0 13px;
    font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
  .eye:hover{ color:var(--tx); }
  .hint{ font-size:11px; color:var(--dim); margin-top:8px; }
  .err{ color:var(--dn); font-size:12.5px; min-height:16px; margin:10px 0 2px; }
  .field+.field{ margin-top:15px; }
  /* strength meter + live checklist, mirroring the admin's Change-password dialog */
  .meter{ margin-top:9px; }
  .bars{ display:flex; gap:5px; }
  .bar{ flex:1; height:4px; border-radius:3px; background:rgba(18,36,58,.12); transition:background .25s; }
  .bar.on1{ background:var(--dn); } .bar.on2{ background:var(--au); }
  .bar.on3{ background:var(--g2); } .bar.on4{ background:var(--g); }
  .slbl{ font-size:11px; font-weight:600; color:var(--dim); margin-top:7px; }
  .reqs{ list-style:none; margin:11px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:5px 12px; }
  .req{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--dim); }
  .req svg{ width:12px; height:12px; flex:none; opacity:.4; }
  .req.ok{ color:var(--mt); } .req.ok svg{ opacity:1; stroke:var(--g2); }
  @media(max-width:420px){ .reqs{ grid-template-columns:1fr; } }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:11px;
    padding:14px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:14px;
    background:linear-gradient(135deg,var(--g),var(--g2)); color:#ffffff; transition:filter .2s,transform .12s; }
  .btn:hover{ filter:brightness(1.06); } .btn:active{ transform:translateY(1px); }
  .btn[disabled]{ opacity:.5; cursor:default; filter:none; transform:none; }
  .center{ text-align:center; }
  .ico{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:6px auto 16px;
    background:rgba(10,107,75,.10); border:1px solid rgba(10,107,75,.28); }
  .ico.warn{ background:rgba(192,60,53,.10); border-color:rgba(192,60,53,.28); }
  .ico svg{ width:28px; height:28px; }
  .muted{ font-size:12.5px; color:var(--mt); line-height:1.7; margin:0 0 18px; }
  .link{ color:var(--g); text-decoration:none; font-weight:600; }
  /* Verifying the invite link is a real wait (an auth round-trip), so it gets a
     considered moment rather than a bare spinner: gold arc, what's happening, and
     an indeterminate sweep — the same language as the site preloader. */
  .boot{ text-align:center; padding:6px 0 2px; }
  .boot-ring{ display:block; width:62px; height:62px; margin:6px auto 20px; border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0%,rgba(154,123,31,.16) 22%,var(--au) 52%,rgba(154,123,31,.16) 78%,transparent 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
    animation:sp 1.15s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .boot-t{ font-family:'Cormorant Garamond',Georgia,serif; font-size:21px; font-weight:700; color:var(--tx); line-height:1.2; }
  .boot-d{ font-size:12.5px; color:var(--mt); margin-top:7px; line-height:1.6; }
  .boot-bar{ position:relative; width:170px; height:2px; margin:18px auto 4px; border-radius:2px;
    background:rgba(154,123,31,.16); overflow:hidden; }
  .boot-bar i{ display:block; height:100%; width:42%; border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--au) 40%,#F4E6BC 50%,var(--au) 60%,transparent);
    animation:bsweep 1.35s cubic-bezier(.22,.61,.36,1) infinite; }
  @keyframes bsweep{ 0%{ transform:translateX(-120%); } 100%{ transform:translateX(360%); } }
  .foot{ text-align:center; font-size:10.5px; letter-spacing:.4px; color:var(--dim); margin-top:18px; }
  @media (prefers-reduced-motion:reduce){ .boot-ring,.boot-bar i{ animation:none; } .boot-bar i{ width:100%; } }
</style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="rule"></div><div class="rule thin"></div>
      <div class="cbody">
        <div class="brand">
          <span class="plate"><img src="assets/img/logo.png" alt="Rallys Equities"></span>
          <h1>Rallys Equities</h1>
          <div class="sub">Website Editor</div>
        </div>
        <div id="stage">
          <div class="boot" role="status" aria-live="polite">
            <span class="boot-ring" aria-hidden="true"></span>
            <div class="boot-t">Verifying your invite</div>
            <div class="boot-d">One moment while we check your link.</div>
            <div class="boot-bar" aria-hidden="true"><i></i></div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">SECP-licensed brokerage · PSX TREC holder</div>
  </div>

<script src="editor/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var stage = document.getElementById('stage');
  var el = function(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; };
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#0A6B4B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var ALERT='<svg viewBox="0 0 24 24" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';

  var cfg = window.RE_SUPABASE;
  if(!cfg || !cfg.url || !cfg.anonKey || !window.supabase){ return invalid('Something isn’t configured correctly. Please ask the site owner for a new invite.'); }
  var sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  // If the auth server bounced back an error (expired/used link), it's in the URL hash.
  var hp = new URLSearchParams((location.hash||'').replace(/^#/,''));
  if(hp.get('error_description')){ return invalid(hp.get('error_description').replace(/\+/g,' ')); }

  waitForSession(0);

  function waitForSession(n){
    sb.auth.getSession().then(function(res){
      if(res && res.data && res.data.session){ return showForm(); }
      if(n >= 20){ return invalid('This invite link is invalid or has expired. Please ask for a fresh one.'); }
      setTimeout(function(){ waitForSession(n+1); }, 150);   // give detectSessionInUrl time to consume the hash
    }).catch(function(){ if(n>=20) invalid('We couldn’t verify this link. Please ask for a fresh invite.'); else setTimeout(function(){ waitForSession(n+1); },150); });
  }

  /* Same four checks and the same wording as the admin's Change-password dialog, so
     the two screens never disagree about what makes a good password. Only the length
     is enforced; the rest guide. */
  var CHECKS=[
    ['8 characters or more', function(v){ return v.length>=8; }],
    ['Upper and lower case', function(v){ return /[a-z]/.test(v)&&/[A-Z]/.test(v); }],
    ['At least one number',  function(v){ return /\d/.test(v); }],
    ['A symbol, like ! ? or @', function(v){ return /[^A-Za-z0-9]/.test(v); }]
  ];
  var WEAK=/^(password|passw0rd|12345678|123456789|qwerty123|letmein|welcome1|iloveyou|rallys123|admin123)$/i;
  var LABELS=['','Too weak','Weak','Good','Strong'];
  function score(v){
    if(!v) return 0;
    var s=0, i;
    for(i=0;i<CHECKS.length;i++) if(CHECKS[i][1](v)) s++;
    if(v.length>=14) s++;
    if(v.length<8||WEAK.test(v)) s=Math.min(s,1);
    return Math.max(1,Math.min(4,s));
  }
  /* password input + show/hide, as one row */
  function pwField(label, ph, aria){
    var inp = el('<input type="password" placeholder="'+ph+'" autocomplete="new-password" aria-label="'+aria+'">');
    var eye = el('<button type="button" class="eye" aria-label="Show password">Show</button>');
    eye.onclick=function(){ var t=inp.type==='password'; inp.type=t?'text':'password'; eye.textContent=t?'Hide':'Show';
      eye.setAttribute('aria-label',t?'Hide password':'Show password'); inp.focus(); };
    var row = el('<div class="pwrow"></div>'); row.append(inp, eye);
    var box = el('<div class="field"></div>');
    box.append(el('<label>'+label+'</label>'), row);
    return { box: box, input: inp };
  }

  function showForm(){
    stage.innerHTML='';
    var f1 = pwField('Create a password','At least 8 characters','New password');
    var f2 = pwField('Confirm password','Type it again','Confirm password');
    var pw = f1.input, pw2 = f2.input;
    var err = el('<div class="err" role="alert"></div>');
    var btn = el('<button class="btn">Create my account</button>');

    /* live strength meter */
    var bars=[], reqs=[], i;
    var barWrap = el('<div class="bars" aria-hidden="true"></div>');
    for(i=0;i<4;i++){ var b=el('<div class="bar"></div>'); bars.push(b); barWrap.append(b); }
    var slbl = el('<div class="slbl">Use at least 8 characters.</div>');
    var reqList = el('<ul class="reqs"></ul>');
    for(i=0;i<CHECKS.length;i++){
      var li = el('<li class="req"><svg viewBox="0 0 24 24" fill="none" stroke="#7D8B9B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>'+CHECKS[i][0]+'</span></li>');
      reqs.push(li); reqList.append(li);
    }
    var meter = el('<div class="meter"></div>'); meter.append(barWrap, slbl, reqList);
    function paint(){
      var v = pw.value||'', s = score(v), k;
      for(k=0;k<bars.length;k++) bars[k].className = 'bar' + (k<s&&v ? ' on'+s : '');
      slbl.textContent = v ? ('Strength: '+LABELS[s]) : 'Use at least 8 characters.';
      for(k=0;k<reqs.length;k++) reqs[k].className = 'req' + (CHECKS[k][1](v) ? ' ok' : '');
    }
    pw.addEventListener('input', paint); paint();

    var wrap = el('<div>'+
      '<h2>Welcome</h2>'+
      '<p class="lead">Set a password to finish setting up your editor account for the Rallys Equities website.</p>'+
    '</div>');
    f1.box.append(meter);
    wrap.append(f1.box, f2.box, err, btn);
    stage.append(wrap);
    setTimeout(function(){ pw.focus(); }, 60);

    function submit(){
      err.textContent='';
      var v = pw.value || '', v2 = pw2.value || '';
      if(v.length < 8){ err.textContent='Please use at least 8 characters.'; pw.focus(); return; }
      if(WEAK.test(v)){ err.textContent='That password is too easy to guess — try something else.'; pw.focus(); return; }
      if(v !== v2){ err.textContent='The two passwords don’t match.'; pw2.focus(); return; }
      btn.disabled=true; btn.textContent='Setting up…';
      sb.auth.updateUser({ password: v }).then(function(res){
        if(res && res.error){ err.textContent = res.error.message || 'Could not set your password.'; btn.disabled=false; btn.textContent='Create my account'; return; }
        markAccepted();
        success();
      }).catch(function(e){ err.textContent = (e && e.message) || 'Could not set your password.'; btn.disabled=false; btn.textContent='Create my account'; });
    }
    btn.onclick=submit;
    pw.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
    pw2.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  }

  /* Flip the invitee's invites row to accepted, so the admin's Editors list
     shows "Accepted" instead of "Pending". RLS lets a signed-in user update
     only their own row's accepted_at. Best-effort — never blocks success. */
  function markAccepted(){
    try{
      sb.auth.getUser().then(function(u){
        var email = u && u.data && u.data.user && u.data.user.email;
        if(!email) return;
        sb.from('invites').update({ accepted_at: new Date().toISOString() })
          .eq('email', email.toLowerCase()).is('accepted_at', null).then(function(){}, function(){});
      }, function(){});
    }catch(e){}
  }

  function success(){
    stage.innerHTML='';
    stage.append(el('<div class="center">'+
      '<div class="ico">'+CHECK+'</div>'+
      '<h2>You’re all set</h2>'+
      '<p class="muted">Your password is saved. You can now sign in and start editing the website.</p>'+
      '<a class="btn" href="/admin" style="text-decoration:none">Go to the editor</a>'+
    '</div>'));
  }

  function invalid(msg){
    stage.innerHTML='';
    stage.append(el('<div class="center">'+
      '<div class="ico warn">'+ALERT+'</div>'+
      '<h2>Link problem</h2>'+
      '<p class="muted">'+String(msg||'').replace(/[<>&]/g,'')+'</p>'+
      '<a class="link" href="/">Back to the website</a>'+
    '</div>'));
  }
})();
</script>
</body>
</html>
